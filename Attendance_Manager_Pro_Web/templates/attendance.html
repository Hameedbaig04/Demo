{% extends "base.html" %}{% block content %}<h1>Daily attendance</h1><form method="get" class="search"><label>Work date <input type="date" name="work_date" value="{{ selected.isoformat() }}"></label><button>Load date</button></form><form method="post"><input type="hidden" name="work_date" value="{{ selected.isoformat() }}"><div class="card tablewrap"><table><thead><tr><th>Employee</th><th>Status</th><th>Check-in</th><th>Check-out</th></tr></thead><tbody>{% for e in employees %}{% set a=records.get(e.id) %}<tr><td><b>{{ e.employee_code }}</b><br>{{ e.full_name }}</td><td><select name="status_{{ e.id }}"><option value="">-- Select --</option>{% for s in statuses %}<option value="{{ s }}" {% if a and a.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></td><td><input type="time" name="in_{{ e.id }}" value="{{ a.check_in if a else '' }}"></td><td><input type="time" name="out_{{ e.id }}" value="{{ a.check_out if a else '' }}"></td></tr>{% else %}<tr><td colspan="4">Add employees first.</td></tr>{% endfor %}</tbody></table></div><button class="save">Save all attendance</button></form>{% endblock %}
