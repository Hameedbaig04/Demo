{% extends "base.html" %}{% block content %}<h1>User management</h1><div class="card"><h2>Create a login for your boss</h2><form method="post" class="formgrid"><label>Username<input name="username" required></label><label>Password (10+ characters)<input type="password" name="password" minlength="10" required></label><label>Role<select name="role"><option value="manager">Manager</option><option value="admin">Admin</option></select></label><div><button>Create user</button></div></form></div><div class="card"><h2>Existing users</h2>{% for u in users %}<p>{{ u.username }} — {{ u.role }} — {{ 'Active' if u.active else 'Inactive' }}</p>{% endfor %}</div>{% endblock %}
