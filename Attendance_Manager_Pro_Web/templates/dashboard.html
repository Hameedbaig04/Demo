{% extends "base.html" %}{% block content %}<h1>Company dashboard</h1><p class="muted">Welcome, {{ current_user }} · {{ today.strftime('%d %b %Y') }}</p><div class="grid"><div class="metric"><span>Active employees</span><strong>{{ total }}</strong></div><div class="metric"><span>Present today</span><strong>{{ present }}</strong></div><div class="metric"><span>Absent today</span><strong>{{ absent }}</strong></div></div><div class="card"><h2>Quick actions</h2><a class="button" href="{{ url_for('attendance') }}">Mark attendance</a> <a class="button secondary" href="{{ url_for('employees') }}">View employees</a></div>{% endblock %}
