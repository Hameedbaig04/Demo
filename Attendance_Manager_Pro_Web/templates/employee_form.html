{% extends "base.html" %}{% block content %}<h1>Add employee</h1><form method="post" class="card formgrid"><label>Employee ID *<input name="employee_code" required></label><label>Full name *<input name="full_name" required></label><label>Department<input name="department"></label><label>Job title<input name="job_title"></label><label>Basic salary (AED)<input name="basic_salary" type="number" min="0" step="0.01" value="0"></label><label>Allowance (AED)<input name="allowance" type="number" min="0" step="0.01" value="0"></label><div><button>Save employee</button> <a href="{{ url_for('employees') }}">Cancel</a></div></form>{% endblock %}
