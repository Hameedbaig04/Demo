services:
  - type: web
    name: attendance-manager-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-manager-db
          property: connectionString
databases:
  - name: attendance-manager-db
    plan: free
